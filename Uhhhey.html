<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Phone</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#000;
  --panel:#1c1c1e;
  --panel2:#2c2c2e;
  --text:#fff;
  --sub:#98989f;
  --blue:#0a84ff;
  --green:#30d158;
  --red:#ff453a;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  color:var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Segoe UI",
    sans-serif;
}

button{
  font:inherit;
  color:inherit;
  border:0;
  outline:0;
}

.app{
  position:relative;
  width:100%;
  max-width:480px;
  height:100dvh;
  margin:auto;
  background:#000;
  overflow:hidden;
}

/* =========================
   SETUP
========================= */

.setup{
  height:100%;
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:32px;
}

.setup-icon{
  width:76px;
  height:76px;
  border-radius:22px;
  background:var(--green);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:40px;
  margin-bottom:25px;
}

.setup h1{
  font-size:34px;
  margin:0 0 10px;
}

.setup p{
  color:var(--sub);
  line-height:1.5;
  margin:0 0 28px;
}

.phone-input{
  width:100%;
  height:58px;
  border-radius:15px;
  border:1px solid #333;
  background:var(--panel);
  color:#fff;
  font-size:22px;
  text-align:center;
  outline:none;
}

.phone-input:focus{
  border-color:var(--blue);
}

.main-btn{
  width:100%;
  height:56px;
  border-radius:15px;
  background:var(--blue);
  margin-top:14px;
  font-weight:600;
}

.error{
  min-height:24px;
  color:var(--red);
  text-align:center;
  margin-top:13px;
  font-size:14px;
}

/* =========================
   MAIN
========================= */

.main{
  height:100%;
  display:none;
  flex-direction:column;
}

.main.show{
  display:flex;
}

.topbar{
  height:82px;
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  padding:0 20px 14px;
  border-bottom:1px solid #222;
}

.top-title{
  font-size:32px;
  font-weight:700;
}

.my-number{
  color:var(--sub);
  font-size:13px;
}

.connection{
  position:absolute;
  top:7px;
  left:50%;
  transform:translateX(-50%);
  color:#666;
  font-size:10px;
  white-space:nowrap;
}

.content{
  flex:1;
  overflow:hidden;
  position:relative;
}

.page{
  display:none;
  width:100%;
  height:100%;
  overflow:auto;
}

.page.active{
  display:block;
}

/* =========================
   KEYPAD
========================= */

.dial-display{
  height:105px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  font-size:34px;
  font-weight:300;
  letter-spacing:1px;
  overflow:hidden;
}

.keypad{
  padding:8px 25px 22px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
}

.key{
  aspect-ratio:1;
  max-width:82px;
  width:100%;
  justify-self:center;
  border-radius:50%;
  background:#2c2c2e;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  font-size:29px;
  transition:.08s;
}

.key small{
  font-size:9px;
  letter-spacing:2px;
  margin-top:2px;
  color:#aaa;
}

.key:active{
  transform:scale(.93);
  background:#444;
}

.empty{
  background:transparent;
}

.call-key{
  background:var(--green);
  font-size:30px;
}

.back-key{
  font-size:23px;
}

/* =========================
   RECENTS
========================= */

.recent-empty{
  height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  color:#777;
}

.recent-empty-icon{
  font-size:50px;
  margin-bottom:12px;
}

/* =========================
   CONTACTS
========================= */

.contacts-empty{
  padding:60px 25px;
  text-align:center;
  color:#777;
}

/* =========================
   NAV
========================= */

.nav{
  height:76px;
  flex-shrink:0;
  border-top:1px solid #222;
  background:rgba(20,20,20,.97);
  display:flex;
}

.nav-btn{
  flex:1;
  background:transparent;
  color:#777;
  font-size:11px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:5px;
}

.nav-btn span{
  font-size:24px;
}

.nav-btn.active{
  color:var(--blue);
}

/* =========================
   INCOMING
========================= */

.incoming{
  position:absolute;
  inset:0;
  z-index:100;
  background:#080808;
  display:none;
  flex-direction:column;
  align-items:center;
  padding-top:105px;
}

.incoming.show{
  display:flex;
}

.incoming-avatar{
  width:112px;
  height:112px;
  border-radius:50%;
  background:#292929;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:47px;
  margin-bottom:27px;
}

.incoming-title{
  font-size:28px;
  font-weight:600;
}

.incoming-number{
  color:#888;
  margin-top:8px;
}

.incoming-label{
  margin-top:35px;
  color:#888;
}

.incoming-buttons{
  position:absolute;
  bottom:70px;
  left:0;
  width:100%;
  display:flex;
  justify-content:center;
  gap:90px;
}

.round-btn{
  width:76px;
  height:76px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
}

.reject{
  background:var(--red);
}

.accept{
  background:var(--green);
}

/* =========================
   CALL SCREEN
========================= */

.call-screen{
  position:absolute;
  inset:0;
  z-index:90;
  background:#000;
  display:none;
  flex-direction:column;
  align-items:center;
  padding-top:95px;
}

.call-screen.show{
  display:flex;
}

.call-avatar{
  width:115px;
  height:115px;
  border-radius:50%;
  background:#292929;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:48px;
  margin-bottom:24px;
}

.call-name{
  font-size:29px;
  font-weight:600;
}

.call-number{
  color:#888;
  margin-top:7px;
}

.call-state{
  margin-top:16px;
  color:#aaa;
}

.call-timer{
  color:#aaa;
  margin-top:8px;
  font-variant-numeric:tabular-nums;
}

.call-controls{
  position:absolute;
  bottom:70px;
  display:grid;
  grid-template-columns:repeat(3,70px);
  gap:24px;
}

.control{
  width:70px;
  height:70px;
  border-radius:50%;
  background:#292929;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  font-size:25px;
}

.control small{
  font-size:10px;
  margin-top:4px;
}

.control.active{
  background:#fff;
  color:#000;
}

.control.hangup{
  background:var(--red);
}

/* =========================
   TOAST
========================= */

.toast{
  position:absolute;
  left:50%;
  bottom:92px;
  transform:translateX(-50%) translateY(20px);
  padding:12px 17px;
  border-radius:14px;
  background:#2c2c2e;
  color:#fff;
  font-size:13px;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  z-index:300;
  white-space:nowrap;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}
</style>
</head>

<body>

<div class="app">

  <!-- ======================
       SETUP
  ======================= -->

  <section id="setup" class="setup">

    <div class="setup-icon">☎</div>

    <h1>전화</h1>

    <p>
      이 기기에서 사용할<br>
      가상 전화번호를 설정하세요.
    </p>

    <input
      id="numberInput"
      class="phone-input"
      inputmode="numeric"
      autocomplete="off"
      maxlength="13"
      placeholder="010-0000-0000">

    <button
      id="startButton"
      class="main-btn">
      전화 시작
    </button>

    <div id="setupError" class="error"></div>

  </section>


  <!-- ======================
       MAIN APP
  ======================= -->

  <section id="main" class="main">

    <div class="connection" id="connection">
      연결 준비 중
    </div>

    <header class="topbar">
      <div class="top-title" id="pageTitle">
        전화
      </div>

      <div class="my-number" id="displayMyNumber"></div>
    </header>


    <div class="content">

      <!-- 전화 -->
      <div
        id="dialPage"
        class="page active">

        <div
          id="dialDisplay"
          class="dial-display">
        </div>

        <div class="keypad">

          <button class="key" data-key="1">
            1
          </button>

          <button class="key" data-key="2">
            2
            <small>ABC</small>
          </button>

          <button class="key" data-key="3">
            3
            <small>DEF</small>
          </button>

          <button class="key" data-key="4">
            4
            <small>GHI</small>
          </button>

          <button class="key" data-key="5">
            5
            <small>JKL</small>
          </button>

          <button class="key" data-key="6">
            6
            <small>MNO</small>
          </button>

          <button class="key" data-key="7">
            7
            <small>PQRS</small>
          </button>

          <button class="key" data-key="8">
            8
            <small>TUV</small>
          </button>

          <button class="key" data-key="9">
            9
            <small>WXYZ</small>
          </button>

          <button class="key" data-key="*">
            *
          </button>

          <button class="key" data-key="0">
            0
            <small>+</small>
          </button>

          <button
            class="key back-key"
            id="backspace">
            ⌫
          </button>

          <div class="empty"></div>

          <button
            id="callButton"
            class="key call-key">
            ☎
          </button>

          <div class="empty"></div>

        </div>

      </div>


      <!-- 최근 통화 -->
      <div
        id="recentPage"
        class="page">

        <div class="recent-empty">
          <div class="recent-empty-icon">◷</div>
          <div>최근 통화가 없습니다</div>
        </div>

      </div>


      <!-- 연락처 -->
      <div
        id="contactsPage"
        class="page">

        <div class="contacts-empty">
          연락처가 없습니다.
        </div>

      </div>

    </div>


    <!-- NAV -->
    <nav class="nav">

      <button
        class="nav-btn active"
        data-page="dial">
        <span>⌨</span>
        전화
      </button>

      <button
        class="nav-btn"
        data-page="recent">
        <span>◷</span>
        최근 통화
      </button>

      <button
        class="nav-btn"
        data-page="contacts">
        <span>👤</span>
        연락처
      </button>

    </nav>

  </section>


  <!-- ======================
       INCOMING CALL
  ======================= -->

  <section
    id="incoming"
    class="incoming">

    <div class="incoming-avatar">
      👤
    </div>

    <div class="incoming-title">
      수신 전화
    </div>

    <div
      id="incomingNumber"
      class="incoming-number">
    </div>

    <div class="incoming-label">
      전화가 왔습니다
    </div>

    <div class="incoming-buttons">

      <button
        id="rejectButton"
        class="round-btn reject">
        ✕
      </button>

      <button
        id="acceptButton"
        class="round-btn accept">
        ☎
      </button>

    </div>

  </section>


  <!-- ======================
       CALL
  ======================= -->

  <section
    id="callScreen"
    class="call-screen">

    <div class="call-avatar">
      👤
    </div>

    <div
      id="callName"
      class="call-name">
    </div>

    <div
      id="callNumber"
      class="call-number">
    </div>

    <div
      id="callState"
      class="call-state">
      연결 중...
    </div>

    <div
      id="callTimer"
      class="call-timer">
    </div>

    <div class="call-controls">

      <button
        id="muteButton"
        class="control">
        🎙
        <small>음소거</small>
      </button>

      <button
        id="speakerButton"
        class="control">
        🔊
        <small>스피커</small>
      </button>

      <button
        id="hangupButton"
        class="control hangup">
        ☎
        <small>종료</small>
      </button>

    </div>

  </section>


  <div
    id="toast"
    class="toast">
  </div>

</div>


<script>
/* ==========================================================
   SUPABASE
========================================================== */

const SUPABASE_URL =
  "https://ajrysthcqilncygvemum.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_0PWrkROtp3VVjV0KP0Kcow_Dnsm5vhF";

const client =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* ==========================================================
   STATE
========================================================== */

let myNumber = "";

let channel = null;

let currentCall = null;

let incomingCall = null;

let peer = null;

let localStream = null;

let remoteAudio = null;

let pendingIce = [];

let muted = false;

let speaker = false;

let timerInterval = null;

let callStartedAt = null;


/* ==========================================================
   ELEMENTS
========================================================== */

const setup =
  document.getElementById("setup");

const main =
  document.getElementById("main");

const numberInput =
  document.getElementById("numberInput");

const setupError =
  document.getElementById("setupError");

const startButton =
  document.getElementById("startButton");

const connection =
  document.getElementById("connection");

const dialDisplay =
  document.getElementById("dialDisplay");

const incoming =
  document.getElementById("incoming");

const callScreen =
  document.getElementById("callScreen");

const toast =
  document.getElementById("toast");


/* ==========================================================
   TOAST
========================================================== */

let toastTimer;

function showToast(message){

  toast.textContent = message;

  toast.classList.add("show");

  clearTimeout(toastTimer);

  toastTimer =
    setTimeout(() => {
      toast.classList.remove("show");
    },2200);
}


/* ==========================================================
   NUMBER FORMAT
========================================================== */

function formatPhone(value){

  const digits =
    value.replace(/\D/g,"").slice(0,11);

  if(digits.length <= 3)
    return digits;

  if(digits.length <= 7)
    return digits.slice(0,3)
      + "-"
      + digits.slice(3);

  return digits.slice(0,3)
    + "-"
    + digits.slice(3,7)
    + "-"
    + digits.slice(7);
}


numberInput.addEventListener(
  "input",
  () => {

    numberInput.value =
      formatPhone(numberInput.value);

    setupError.textContent = "";

  }
);


/* ==========================================================
   START
========================================================== */

startButton.addEventListener(
  "click",
  startPhone
);


numberInput.addEventListener(
  "keydown",
  e => {

    if(e.key === "Enter")
      startPhone();

  }
);


async function startPhone(){

  const number =
    numberInput.value.trim();


  if(number.replace(/\D/g,"").length < 10){

    setupError.textContent =
      "전화번호를 10자리 이상 입력해주세요.";

    return;

  }


  /*
    여기서 화면부터 전환한다.
    Supabase 연결 때문에 앱 진입이 막히지 않도록
    분리해둔 부분.
  */

  myNumber = number;

  localStorage.setItem(
    "fake_phone_number",
    myNumber
  );


  document.getElementById(
    "displayMyNumber"
  ).textContent =
    myNumber;


  setup.style.display = "none";

  main.classList.add("show");


  connection.textContent =
    "서버 연결 중...";


  /*
    서버 연결 실패해도 전화 UI는 사용할 수 있도록
    오류를 잡는다.
  */

  try{

    await connectRealtime();

  }catch(error){

    console.error(error);

    connection.textContent =
      "오프라인";

    showToast(
      "서버 연결에 실패했습니다."
    );

  }

}


/* ==========================================================
   RESTORE NUMBER
========================================================== */

window.addEventListener(
  "load",
  () => {

    const saved =
      localStorage.getItem(
        "fake_phone_number"
      );

    if(saved)
      numberInput.value = saved;

  }
);


/* ==========================================================
   SUPABASE REALTIME
========================================================== */

async function connectRealtime(){

  if(channel)
    return;


  channel =
    client.channel(
      "phone-network",
      {
        config:{
          broadcast:{
            self:false
          },
          presence:{
            key:myNumber
          }
        }
      }
    );


  channel.on(
    "broadcast",
    {
      event:"phone"
    },
    ({payload}) => {

      handlePhoneEvent(payload);

    }
  );


  channel.on(
    "presence",
    {
      event:"sync"
    },
    () => {

      connection.textContent =
        "온라인";

    }
  );


  await new Promise(
    (resolve,reject) => {

      const timeout =
        setTimeout(
          () => {

            reject(
              new Error(
                "Realtime connection timeout"
              )
            );

          },
          8000
        );


      channel.subscribe(
        async status => {

          if(status === "SUBSCRIBED"){

            clearTimeout(timeout);

            await channel.track({

              number:myNumber,

              online:true,

              joinedAt:Date.now()

            });


            connection.textContent =
              "온라인";

            resolve();

          }


          if(status === "CHANNEL_ERROR"){

            clearTimeout(timeout);

            reject(
              new Error(
                "Supabase channel error"
              )
            );

          }

        }
      );

    }
  );

}


/* ==========================================================
   SEND
========================================================== */

async function send(data){

  if(!channel){

    showToast(
      "서버에 연결되지 않았습니다."
    );

    return;

  }


  await channel.send({

    type:"broadcast",

    event:"phone",

    payload:data

  });

}


/* ==========================================================
   PHONE EVENTS
========================================================== */

function handlePhoneEvent(data){

  if(!data)
    return;


  /*
    incoming call
  */

  if(
    data.type === "call" &&
    data.to === myNumber
  ){

    incomingCall = data;

    document.getElementById(
      "incomingNumber"
    ).textContent =
      data.from;


    incoming.classList.add(
      "show"
    );

    return;

  }


  /*
    accepted
  */

  if(
    data.type === "accepted" &&
    currentCall &&
    data.callId === currentCall.callId
  ){

    startCallerPeer();

    return;

  }


  /*
    rejected
  */

  if(
    data.type === "rejected" &&
    currentCall &&
    data.callId === currentCall.callId
  ){

    document.getElementById(
      "callState"
    ).textContent =
      "통화가 거절되었습니다.";

    setTimeout(
      endCall,
      1200
    );

    return;

  }


  /*
    offer
  */

  if(
    data.type === "offer" &&
    data.to === myNumber
  ){

    receiveOffer(data);

    return;

  }


  /*
    answer
  */

  if(
    data.type === "answer" &&
    data.to === myNumber
  ){

    receiveAnswer(data);

    return;

  }


  /*
    ICE
  */

  if(
    data.type === "ice" &&
    data.to === myNumber
  ){

    receiveIce(data);

    return;

  }


  /*
    hangup
  */

  if(
    data.type === "hangup" &&
    currentCall &&
    data.callId === currentCall.callId
  ){

    document.getElementById(
      "callState"
    ).textContent =
      "통화 종료";

    setTimeout(
      endCall,
      500
    );

  }

}


/* ==========================================================
   KEYPAD
========================================================== */

document
  .querySelectorAll(".key[data-key]")
  .forEach(button => {

    button.addEventListener(
      "click",
      () => {

        dialDisplay.textContent +=
          button.dataset.key;

      }
    );

  });


document
  .getElementById("backspace")
  .addEventListener(
    "click",
    () => {

      dialDisplay.textContent =
        dialDisplay.textContent.slice(0,-1);

    }
  );


/* ==========================================================
   CALL BUTTON
========================================================== */

document
  .getElementById("callButton")
  .addEventListener(
    "click",
    makeCall
  );


async function makeCall(){

  const target =
    dialDisplay.textContent.trim();


  if(!target){

    showToast(
      "전화번호를 입력해주세요."
    );

    return;

  }


  if(target === myNumber){

    showToast(
      "자기 자신에게 전화할 수 없습니다."
    );

    return;

  }


  currentCall = {

    callId:crypto.randomUUID(),

    from:myNumber,

    to:target,

    direction:"outgoing"

  };


  openCallScreen(
    target,
    "전화 거는 중..."
  );


  await send({

    type:"call",

    callId:currentCall.callId,

    from:myNumber,

    to:target

  });

}


/* ==========================================================
   INCOMING ACCEPT
========================================================== */

document
  .getElementById("acceptButton")
  .addEventListener(
    "click",
    acceptCall
  );


async function acceptCall(){

  if(!incomingCall)
    return;


  currentCall = {

    callId:incomingCall.callId,

    from:incomingCall.from,

    to:myNumber,

    direction:"incoming"

  };


  incoming.classList.remove(
    "show"
  );


  openCallScreen(
    incomingCall.from,
    "연결 중..."
  );


  await send({

    type:"accepted",

    callId:currentCall.callId,

    from:myNumber,

    to:incomingCall.from

  });


  await startReceiverPeer();

}


/* ==========================================================
   INCOMING REJECT
========================================================== */

document
  .getElementById("rejectButton")
  .addEventListener(
    "click",
    rejectCall
  );


async function rejectCall(){

  if(!incomingCall)
    return;


  await send({

    type:"rejected",

    callId:incomingCall.callId,

    from:myNumber,

    to:incomingCall.from

  });


  incoming.classList.remove(
    "show"
  );


  incomingCall = null;

}


/* ==========================================================
   CALL UI
========================================================== */

function openCallScreen(
  number,
  state
){

  document.getElementById(
    "callName"
  ).textContent =
    number;

  document.getElementById(
    "callNumber"
  ).textContent =
    number;

  document.getElementById(
    "callState"
  ).textContent =
    state;

  document.getElementById(
    "callTimer"
  ).textContent =
    "";


  callScreen.classList.add(
    "show"
  );

}


function startTimer(){

  clearInterval(
    timerInterval
  );


  callStartedAt =
    Date.now();


  timerInterval =
    setInterval(
      () => {

        const seconds =
          Math.floor(
            (Date.now() -
             callStartedAt) / 1000
          );


        const min =
          String(
            Math.floor(seconds / 60)
          ).padStart(2,"0");


        const sec =
          String(
            seconds % 60
          ).padStart(2,"0");


        document.getElementById(
          "callTimer"
        ).textContent =
          `${min}:${sec}`;

      },
      1000
    );

}


/* ==========================================================
   WEBRTC PEER
========================================================== */

function createPeer(remoteNumber){

  const pc =
    new RTCPeerConnection({

      iceServers:[

        {
          urls:
            "stun:stun.l.google.com:19302"
        },

        {
          urls:
            "stun:stun1.l.google.com:19302"
        }

      ]

    });


  pc.onicecandidate =
    async event => {

      if(!event.candidate)
        return;


      await send({

        type:"ice",

        callId:
          currentCall.callId,

        from:myNumber,

        to:remoteNumber,

        candidate:
          event.candidate

      });

    };


  pc.ontrack =
    event => {

      if(!remoteAudio){

        remoteAudio =
          document.createElement(
            "audio"
          );

        remoteAudio.autoplay =
          true;

        remoteAudio.playsInline =
          true;

        document.body.appendChild(
          remoteAudio
        );

      }


      remoteAudio.srcObject =
        event.streams[0];

    };


  pc.onconnectionstatechange =
    () => {

      console.log(
        "WebRTC:",
        pc.connectionState
      );


      if(
        pc.connectionState ===
        "connected"
      ){

        document.getElementById(
          "callState"
        ).textContent =
          "통화 중";

        startTimer();

      }


      if(
        pc.connectionState ===
          "failed"
        ||
        pc.connectionState ===
          "disconnected"
      ){

        document.getElementById(
          "callState"
        ).textContent =
          "연결이 끊어졌습니다.";

      }

    };


  return pc;

}


/* ==========================================================
   MICROPHONE
========================================================== */

async function getMicrophone(){

  if(localStream)
    return;


  localStream =
    await navigator.mediaDevices
      .getUserMedia({

        audio:{
          echoCancellation:true,
          noiseSuppression:true,
          autoGainControl:true
        },

        video:false

      });

}


/* ==========================================================
   CALLER
========================================================== */

async function startCallerPeer(){

  try{

    await getMicrophone();


    peer =
      createPeer(
        currentCall.to
      );


    localStream
      .getTracks()
      .forEach(
        track => {

          peer.addTrack(
            track,
            localStream
          );

        }
      );


    const offer =
      await peer.createOffer();


    await peer.setLocalDescription(
      offer
    );


    await send({

      type:"offer",

      callId:
        currentCall.callId,

      from:myNumber,

      to:currentCall.to,

      offer:offer

    });

  }catch(error){

    console.error(error);

    showToast(
      "마이크를 사용할 수 없습니다."
    );

  }

}


/* ==========================================================
   RECEIVER
========================================================== */

async function startReceiverPeer(){

  try{

    await getMicrophone();


    peer =
      createPeer(
        currentCall.from
      );


    localStream
      .getTracks()
      .forEach(
        track => {

          peer.addTrack(
            track,
            localStream
          );

        }
      );

  }catch(error){

    console.error(error);

    showToast(
      "마이크 권한이 필요합니다."
    );

  }

}


/* ==========================================================
   OFFER
========================================================== */

async function receiveOffer(data){

  if(!currentCall)
    return;


  try{

    if(!peer)
      await startReceiverPeer();


    await peer.setRemoteDescription(
      new RTCSessionDescription(
        data.offer
      )
    );


    const answer =
      await peer.createAnswer();


    await peer.setLocalDescription(
      answer
    );


    await send({

      type:"answer",

      callId:
        data.callId,

      from:myNumber,

      to:data.from,

      answer:answer

    });


    /*
      ICE 후보가 먼저 도착했을 경우 처리
    */

    for(
      const candidate
      of pendingIce
    ){

      try{

        await peer.addIceCandidate(
          new RTCIceCandidate(
            candidate
          )
        );

      }catch(e){}

    }


    pendingIce = [];

  }catch(error){

    console.error(error);

  }

}


/* ==========================================================
   ANSWER
========================================================== */

async function receiveAnswer(data){

  if(!peer)
    return;


  try{

    await peer.setRemoteDescription(
      new RTCSessionDescription(
        data.answer
      )
    );


    for(
      const candidate
      of pendingIce
    ){

      try{

        await peer.addIceCandidate(
          new RTCIceCandidate(
            candidate
          )
        );

      }catch(e){}

    }


    pendingIce = [];

  }catch(error){

    console.error(error);

  }

}


/* ==========================================================
   ICE
========================================================== */

async function receiveIce(data){

  if(!peer){

    pendingIce.push(
      data.candidate
    );

    return;

  }


  try{

    await peer.addIceCandidate(
      new RTCIceCandidate(
        data.candidate
      )
    );

  }catch(error){

    console.warn(
      "ICE error",
      error
    );

  }

}


/* ==========================================================
   MUTE
========================================================== */

document
  .getElementById("muteButton")
  .addEventListener(
    "click",
    () => {

      if(!localStream)
        return;


      muted = !muted;


      localStream
        .getAudioTracks()
        .forEach(
          track => {

            track.enabled =
              !muted;

          }
        );


      document
        .getElementById(
          "muteButton"
        )
        .classList.toggle(
          "active",
          muted
        );

    }
  );


/* ==========================================================
   SPEAKER
========================================================== */

document
  .getElementById("speakerButton")
  .addEventListener(
    "click",
    () => {

      speaker = !speaker;


      document
        .getElementById(
          "speakerButton"
        )
        .classList.toggle(
          "active",
          speaker
        );


      if(remoteAudio){

        remoteAudio.volume =
          speaker ? 1 : .55;

      }

    }
  );


/* ==========================================================
   HANGUP
========================================================== */

document
  .getElementById("hangupButton")
  .addEventListener(
    "click",
    hangUp
  );


async function hangUp(){

  if(currentCall){

    const target =
      currentCall.direction ===
      "outgoing"
        ? currentCall.to
        : currentCall.from;


    await send({

      type:"hangup",

      callId:
        currentCall.callId,

      from:myNumber,

      to:target

    });

  }


  endCall();

}


function endCall(){

  clearInterval(
    timerInterval
  );

  timerInterval = null;


  if(peer){

    peer.close();

    peer = null;

  }


  if(localStream){

    localStream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );

    localStream = null;

  }


  if(remoteAudio){

    remoteAudio.srcObject =
      null;

    remoteAudio.remove();

    remoteAudio = null;

  }


  currentCall = null;

  incomingCall = null;

  pendingIce = [];

  muted = false;

  speaker = false;


  document
    .getElementById(
      "muteButton"
    )
    .classList.remove(
      "active"
    );


  document
    .getElementById(
      "speakerButton"
    )
    .classList.remove(
      "active"
    );


  callScreen.classList.remove(
    "show"
  );

}


/* ==========================================================
   NAVIGATION
========================================================== */

document
  .querySelectorAll(".nav-btn")
  .forEach(button => {

    button.addEventListener(
      "click",
      () => {

        const page =
          button.dataset.page;


        document
          .querySelectorAll(".nav-btn")
          .forEach(
            b =>
              b.classList.remove(
                "active"
              )
          );


        button.classList.add(
          "active"
        );


        document
          .querySelectorAll(".page")
          .forEach(
            p =>
              p.classList.remove(
                "active"
              )
          );


        document
          .getElementById(
            page + "Page"
          )
          .classList.add(
            "active"
          );


        const titles = {

          dial:"전화",

          recent:"최근 통화",

          contacts:"연락처"

        };


        document.getElementById(
          "pageTitle"
        ).textContent =
          titles[page];

      }

    );

  });
</script>
